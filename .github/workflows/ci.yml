# CI — Tests automáticos en cada push/PR a master.
#
# Job 1 (unit-tests): tests del motor CSP (solver, intensidad, validación,
#   regeneración). No necesitan base de datos — usan fixtures sintéticas.
#
# Job 2 (integration-tests): tests de integración SQL (triggers, constraints,
#   RLS). Usan un contenedor Postgres 17 en CI — sin necesidad de secrets
#   ni conexión a Supabase. El schema se inicializa desde sql/schema.sql
#   y sql/rls.sql en cada ejecución.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Tests unitarios (sin DB) — siempre se ejecutan
  # ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Tests unitarios (motor CSP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/test_solver.py tests/test_intensity.py tests/test_validation.py tests/test_horarios_regeneracion.py -v --tb=short

  # ─────────────────────────────────────────────────────────────
  # Tests de integración SQL — contenedor Postgres local en CI
  # ─────────────────────────────────────────────────────────────
  integration-tests:
    name: Tests de integración SQL (triggers + RLS)
    runs-on: ubuntu-latest

    # Contenedor Postgres como servicio
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Esperar a que Postgres esté listo
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Initialize database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -f sql/schema.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -f sql/rls.sql

      - name: Run SQL integration tests
        run: |
          PYTHONPATH=. pytest tests/test_sql_integration.py -v --tb=short
