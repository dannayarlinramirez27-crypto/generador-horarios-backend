# CI — Tests automáticos en cada push/PR a master.
#
# Job 1 (unit-tests): tests del motor CSP (solver, intensidad, validación,
#   regeneración). No necesitan base de datos — usan fixtures sintéticas.
#
# Job 2 (integration-tests): tests de integración SQL (triggers, constraints,
#   RLS). Necesitan DATABASE_URL configurada como GitHub Secret.
#
# Configurar el secret:
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#   Name:  DATABASE_URL
#   Value: postgresql://postgres.<ref>:<password>@db.<ref>.supabase.co:5432/postgres

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Tests unitarios (sin DB) — siempre se ejecutan
  # ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Tests unitarios (motor CSP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest tests/test_solver.py tests/test_intensity.py tests/test_validation.py tests/test_horarios_regeneracion.py -v --tb=short

  # ─────────────────────────────────────────────────────────────
  # Tests de integración SQL (necesitan DATABASE_URL)
  # ─────────────────────────────────────────────────────────────
  integration-tests:
    name: Tests de integración SQL (triggers + RLS)
    runs-on: ubuntu-latest
    # Solo ejecutar si el secret DATABASE_URL está configurado
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Skip if DATABASE_URL not configured
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "⚠️ DATABASE_URL no configurada — saltando tests de integración."
          echo "Configurar el secret en: Settings → Secrets → Actions"
          exit 0

      - name: Set up Python 3.14
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run SQL integration tests
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          pytest tests/test_sql_integration.py -v --tb=short
