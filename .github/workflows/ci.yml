# CI — Tests automáticos en cada push/PR a master.
#
# Job 1 (unit-tests): tests de auth y del motor CSP (solver, intensidad,
#   validación, regeneración). No necesitan base de datos — usan fixtures sintéticas.
#
# Job 2 (integration-tests): tests de integración SQL (triggers, constraints,
#   RLS). Usan un contenedor Postgres 17 en CI — sin necesidad de secrets
#   ni conexión a Supabase. El schema se inicializa desde sql/schema.sql
#   y sql/rls.sql en cada ejecución.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Tests unitarios (sin DB) — siempre se ejecutan
  # ─────────────────────────────────────────────────────────────
  unit-tests:
    name: Tests unitarios (auth + motor CSP)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          PYTHONPATH=. pytest tests/test_auth.py tests/test_ownership.py tests/test_solver.py tests/test_intensity.py tests/test_validation.py tests/test_horarios_regeneracion.py -v --tb=short

  # ─────────────────────────────────────────────────────────────
  # Tests de integración SQL — contenedor Postgres local en CI
  # ─────────────────────────────────────────────────────────────
  integration-tests:
    name: Tests de integración SQL (triggers + RLS)
    runs-on: ubuntu-latest

    # Contenedor Postgres como servicio
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Esperar a que Postgres esté listo
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Initialize database schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -f sql/auth_mock.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -f sql/schema.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -f sql/rls.sql
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -f sql/ci_grants.sql

      - name: Run SQL integration tests
        run: |
          PYTHONPATH=. pytest tests/test_sql_integration.py -v --tb=short

  # ─────────────────────────────────────────────────────────────
  # Migración de ownership — servicio Postgres aislado y desechable
  # ─────────────────────────────────────────────────────────────
  ownership-migration-validation:
    name: Validar migración de ownership (Postgres desechable)
    runs-on: ubuntu-latest

    services:
      ownership-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ownership_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ownership_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      OWNERSHIP_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ownership_migration_test

    steps:
      - uses: actions/checkout@v4

      - name: Initialize disposable legacy-like database
        run: |
          psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/auth_mock.sql
          psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/schema.sql
          psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/account_ownership_migration_legacy.sql

      - name: Verify mismatch preflight fails without changing the database
        run: |
          psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/account_ownership_migration_mismatch.sql
          if psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/migrations/20261106_per_account_ownership.sql > ownership-migration-preflight.log 2>&1; then
            cat ownership-migration-preflight.log
            echo "Expected the ownership mismatch preflight to fail."
            exit 1
          fi
          grep -Fq "Ownership migration stopped: 1 horarios rows have conflicting user_id and usuario_id values" ownership-migration-preflight.log || {
            cat ownership-migration-preflight.log
            echo "The migration failed without the expected mismatch diagnostic."
            exit 1
          }
          psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/account_ownership_migration_preflight_rollback_assertions.sql
          psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/account_ownership_migration_repair.sql
          psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/account_ownership_migration_cross_reference_mismatch.sql
          if psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/migrations/20261106_per_account_ownership.sql > ownership-migration-reference-preflight.log 2>&1; then
            cat ownership-migration-reference-preflight.log
            echo "Expected the cross-owner reference preflight to fail."
            exit 1
          fi
          grep -Fq "Ownership migration stopped: 1 docente_materia rows reference a docente or materia with a different owner" ownership-migration-reference-preflight.log || {
            cat ownership-migration-reference-preflight.log
            echo "The migration failed without the expected cross-owner reference diagnostic."
            exit 1
          }
          psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/account_ownership_migration_cross_reference_rollback_assertions.sql

      - name: Apply migration twice and assert ownership guarantees
        run: |
          psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/account_ownership_migration_repair.sql
          psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/migrations/20261106_per_account_ownership.sql
          psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/migrations/20261106_per_account_ownership.sql
          psql "$OWNERSHIP_MIGRATION_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/account_ownership_migration_assertions.sql
